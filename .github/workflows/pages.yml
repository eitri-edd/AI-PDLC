name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site/dist/**
      - .github/workflows/pages.yml
      - .github/workflows/pages-checks.yml
      - .github/scripts/assemble_pages.py
  # This event runs the workflow from the default branch, not from dev.
  workflow_run:
    workflows: [Validate Pages]
    branches: [dev]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    # Keep the existing main-only github-pages environment protection. A PR
    # validation or a manual run on dev must never deploy.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'dev' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    # Rejected events must not acquire the deployment lock.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always read both branch tips after acquiring the deployment lock.
      - name: Check out production and trusted deployment code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          path: production
          persist-credentials: false
      - name: Check out dev static content only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          path: development
          sparse-checkout: site/dist
          persist-credentials: false
      # Never execute dev scripts or download artefacts from its workflow.
      - name: Assemble production root and dev subtree
        run: python3 production/.github/scripts/assemble_pages.py production/site/dist development/site/dist public
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
