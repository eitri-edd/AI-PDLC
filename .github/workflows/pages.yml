name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site/dist/**
      - .github/workflows/pages.yml
      - .github/workflows/pages-checks.yml
      - .github/scripts/assemble_pages.py
  # This event runs the workflow from the default branch, not from dev.
  workflow_run:
    workflows: [Validate Pages]
    branches: [dev]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    # Keep the existing main-only github-pages environment protection. A PR
    # validation or a manual run on dev must never deploy.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'dev' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    # Rejected events must not acquire the deployment lock. Reading the branch
    # tips inside this single locked job also means a queued run assembles the
    # current tips rather than stale content frozen before the lock.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always read both branch tips after acquiring the deployment lock.
      - name: Check out production and trusted deployment code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: production
          persist-credentials: false
      - name: Check out dev static content only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          path: development
          sparse-checkout: site/dist
          persist-credentials: false
      # Never execute dev scripts or download artefacts from its workflow.
      - name: Assemble production root and dev subtree
        run: python3 production/.github/scripts/assemble_pages.py production/site/dist development/site/dist public
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
      # deploy-pages looks up the artifact through the internal Actions results
      # API. That API can lag the public artifact list, so poll the same API
      # before deploying instead of splitting the branch-tip checkout into an
      # unlocked build job (actions/deploy-pages#451). Use a JavaScript action
      # because the runner exposes ACTIONS_RUNTIME_TOKEN only to action steps,
      # not directly to shell steps.
      - name: Wait for the Pages artifact in the deployment API
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const artifactName = 'github-pages'
            const token = process.env.ACTIONS_RUNTIME_TOKEN
            const resultsUrl = process.env.ACTIONS_RESULTS_URL
            if (!token || !resultsUrl) {
              throw new Error('Actions artifact API credentials are unavailable')
            }
            const payload = token.split('.')[1]
            const claims = JSON.parse(Buffer.from(payload, 'base64url').toString('utf8'))
            const resultScope = (claims.scp || '').split(' ').find((scope) => scope.startsWith('Actions.Results:'))
            const scopeParts = resultScope ? resultScope.split(':') : []
            if (scopeParts.length !== 3) {
              throw new Error('Actions runtime token has no Actions.Results scope')
            }
            const endpoint = new URL('/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts', new URL(resultsUrl).origin).href
            const body = JSON.stringify({
              workflowRunBackendId: scopeParts[1],
              workflowJobRunBackendId: scopeParts[2],
            })
            for (let attempt = 1; attempt <= 12; attempt++) {
              let detail = 'request failed'
              let count = 0
              try {
                const response = await fetch(endpoint, {
                  method: 'POST',
                  headers: {
                    authorization: `Bearer ${token}`,
                    'content-type': 'application/json',
                  },
                  body,
                })
                detail = `HTTP ${response.status}`
                if (response.ok) {
                  const result = await response.json()
                  count = (result.artifacts || []).filter((artifact) => artifact.name === artifactName).length
                  detail = `${count} matching artifact(s)`
                  if (count === 1) {
                    console.log(`${artifactName} is visible to the deployment artifact API.`)
                    return
                  }
                }
              } catch (error) {
                detail = error.name
              }
              console.log(`Artifact API attempt ${attempt}: ${detail}; retrying.`)
              if (attempt < 12) {
                await new Promise((resolve) => setTimeout(resolve, 5000))
              }
            }
            throw new Error(`${artifactName} was not visible to the deployment artifact API after 60 seconds`)
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
